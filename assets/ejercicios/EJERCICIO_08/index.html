<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Ejercicio 08</title>
</head>
<body>
    <section class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 text-center">
                <div class="card-header bg-dark text-white py-3">
                    <h4 class="mb-0">Buscador de Contactos</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small">Ingresa los 9 dígitos del celular</p>
                    <div class="input-group mb-3">
                        <span class="input-group-text bg-light">9</span>
                        <input type="text" id="inputTelefono" class="form-control form-control-lg" 
                               placeholder="87654321" maxlength="8">
                    </div>

                    <div class="d-grid gap-2">
                        <button id="btnBuscar" class="btn btn-dark btn-lg shadow-sm">
                            🔍 Buscar Nombre
                        </button>
                        <a href="../../../index.html" class="btn btn-outline-secondary btn-sm mt-2">
                            Volver al Menú
                        </a>
                    </div>

                    <div id="resultadoBusqueda" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="assets/js/app.js"></script>
</body>
