<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Ejercicio 03</title>
</head>

<body>
    <main class="container mt-5">
        <section class="row justify-content-center">
            <div class="col-md-6">
                <article class="card shadow border-0">
                    <header class="card-header bg-success text-white text-center">
                        <h4 class="mb-0">Calculadora de Área de un Circulo</h4>
                    </header>
                    <div class="card-body p-4">
                        <p class="text-muted mb-4">
                            Introduce el diámetro del círculo para calcular su área.
                        </p>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Diámetro</span>
                            <input type="number" id="inputDiametro" class="form-control" placeholder="Ej: 10"
                                step="any">
                            <button id="btnCalcular" class="btn btn-success" type="button">Calcular</button>
                        </div>

                        <output id="resultado" class="alert alert-info d-none"></output>

                        <nav class="d-grid mt-4">
                            <a href="../../../index.html" class="btn btn-outline-secondary btn-sm">Volver al Menú</a>
                        </nav>
                    </div>
                    <footer class="card-footer bg-transparent text-center small text-muted">
                        Ejercicio de lógica matemática con JS
                    </footer>
                </article>
            </div>
        </section>
    </main>
    <script src="assets/js/app.js"></script>
</body>

</html>
