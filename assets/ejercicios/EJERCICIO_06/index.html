<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Ejercicio 06</title>
</head>

<body>
    <section class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-success text-white py-3 text-center">
                        <h4 class="mb-0">💰 Calculadora de IVA (19%)</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="mb-3">
                            <label for="monto" class="form-label fw-bold">Precio Unitario ($):</label>
                            <input type="number" id="monto" class="form-control" placeholder="Ej: 10000" min="1">
                        </div>

                        <div class="mb-3">
                            <label for="cantidad" class="form-label fw-bold">Cantidad:</label>
                            <input type="number" id="cantidad" class="form-control" placeholder="Ej: 2" min="1">
                        </div>

                        <div class="d-grid gap-2">
                            <button id="btnCalcular" class="btn btn-success btn-lg shadow-sm">
                                Calcular Total
                            </button>
                            <a href="../../../index.html" class="btn btn-outline-secondary btn-sm mt-2">
                                Volver al Menú
                            </a>
                        </div>

                        <div id="resultado" class="mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="assets/js/app.js"></script>
</body>

</html>
