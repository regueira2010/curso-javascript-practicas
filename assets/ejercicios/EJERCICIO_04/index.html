<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Ejercicio 04</title>
</head>

<body>
    <section class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0 text-center">📅 Días del Mes</h4>
                    </div>

                    <div class="card-body p-4">
                        <div class="mb-4">
                            <label for="mes" class="form-label fw-bold text-secondary">
                                Selecciona un mes de la lista:
                            </label>
                            <select id="mes" class="form-select form-select-lg border-primary-subtle">
                                <option value="" selected disabled>-- Elige un mes --</option>
                                <option value="enero">Enero</option>
                                <option value="febrero">Febrero</option>
                                <option value="marzo">Marzo</option>
                                <option value="abril">Abril</option>
                                <option value="mayo">Mayo</option>
                                <option value="junio">Junio</option>
                                <option value="julio">Julio</option>
                                <option value="agosto">Agosto</option>
                                <option value="septiembre">Septiembre</option>
                                <option value="octubre">Octubre</option>
                                <option value="noviembre">Noviembre</option>
                                <option value="diciembre">Diciembre</option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button id="btnMes" class="btn btn-primary btn-lg shadow-sm">
                                Consultar Días
                            </button>
                            <a href="../../../index.html" class="btn btn-outline-secondary btn-sm mt-2">
                                Volver al Menú
                            </a>
                        </div>

                        <div id="resultado" class="mt-4 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="assets/js/app.js"></script>
</body>

</html>
